<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chandpur District Quiz - Login</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);

            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            padding: 40px;

            background: white;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 10px;
            color: #1e3c72;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;

            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 8px;

            box-sizing: border-box;
            font-size: 15px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;

            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #1e3c72;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #2a5298;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>Chandpur Quiz</h1>

    <p>Login to start the quiz</p>

    <form action="login" method="post">

        <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required>

        <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

        <button type="submit">
            LOGIN
        </button>

    </form>

</div>

</body>

</html>
